# CongLive WebRTC-only edge configuration.
# Public clients use WHIP/WHEP through authenticated backend proxy routes.
# SRS is the SFU; UDP/TCP 8000 carries encrypted WebRTC media packets.
listen              1935;
# RTMP listener stays internal for SRS RTC->RTMP DVR transmux; do not publish 1935 from Docker.
max_connections     1000;

rtc_server {
  enabled           on;
  listen            8000;
  # TCP is used by default because many carrier/CGNAT networks blackhole or
  # remap the UDP flow. Switch to "udp" or "all" if your viewers' networks
  # support direct WebRTC over UDP.
  protocol          tcp;
  candidate         $CANDIDATE;
  # Do not advertise Docker-internal / API-container addresses.
  use_auto_detect_network_ip off;
  api_as_candidates off;
  tcp {
    enabled         on;
    listen          8000;
  }
}

http_server {
  enabled           on;
  listen            8080;
  dir               ./objs/nginx/html;
}

http_api {
  enabled           on;
  listen            1985;
}

vhost __defaultVhost__ {
  rtc {
    enabled         on;
    # Keep MP4 DVR recording via SRS RTC -> RTMP transmux.
    # SRS converts Opus audio to AAC; video remains H.264.
    rtc_to_rtmp     on;
    pli_for_rtmp    6.0;
  }

  http_hooks {
    enabled         on;
    on_publish      http://backend:3000/api/srs/on_publish?secret=$SRS_HOOK_SECRET;
    on_unpublish    http://backend:3000/api/srs/on_unpublish?secret=$SRS_HOOK_SECRET;
    on_play          http://backend:3000/api/srs/on_play?secret=$SRS_HOOK_SECRET;
    on_stop          http://backend:3000/api/srs/on_stop?secret=$SRS_HOOK_SECRET;
  }

  dvr {
    enabled         on;
    dvr_apply       all;
    dvr_plan        session;
    dvr_path        ./objs/nginx/html/recordings/live/[stream].[timestamp].mp4;
    dvr_duration    3600;
  }
}
