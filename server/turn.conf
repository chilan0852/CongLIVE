# CongLive coturn (TURN) configuration template.
#
# server/install.sh replaces $TURN_SECRET, $CANDIDATE and $PUBLIC_HOST and
# writes server/turn.runtime.conf, which docker compose mounts read-only into
# the coturn container as /etc/coturn/turnserver.conf. Never deploy this
# template as-is: the placeholders are not valid values.
#
# The coturn container runs with host networking, so it binds these ports
# directly on the VPS: 3478 (UDP/TCP) and the relay range 49160-49200 (UDP).
listening-port=3478
# Include fingerprints in TURN messages (required by modern browsers).
fingerprint

# Short-term TURN REST credentials. The browser voice client asks the backend
# for GET /api/turn-credentials and receives:
#   username   = <unix-expiry>:conglive
#   credential = base64(HMAC-SHA1(static-auth-secret, username))
# use-auth-secret implies the long-term credential mechanism internally.
use-auth-secret
static-auth-secret=$TURN_SECRET
realm=$PUBLIC_HOST

# Cloud VPS behind 1:1 NAT must advertise the public address in relay candidates.
external-ip=$CANDIDATE

# UDP relay range; server/install.sh opens the same range in UFW and the VPS
# provider firewall must allow it too.
min-port=49160
max-port=49200

# Only plain TURN over UDP/TCP 3478 is advertised. TLS is not deployed for
# coturn (the API and web UI are the HTTPS endpoints), so disable TLS/DTLS.
no-tls
no-dtls

# Container logging and safety defaults.
log-file=stdout
simple-log
no-cli
no-multicast-peers
