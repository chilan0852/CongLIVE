services:
  srs:
    image: ossrs/srs:v6.0.195
    container_name: conglive-srs
    restart: unless-stopped
    command: ./objs/srs -c conf/conglive.conf
    # SRS 对外仅开放 WebRTC 媒体端口；WHIP/WHEP 信令经过鉴权 API 代理。
    # SRS 的 RTMP 端口仅供 RTC->RTMP 内部录像转换，不映射到公网。
    environment:
      CANDIDATE: ${CANDIDATE:-*}
      SRS_HOOK_SECRET: ${SRS_HOOK_SECRET:?请先运行 server/install.sh}
    ports:
      - "${RTC_BIND:-0.0.0.0}:8000:8000/udp"
      - "${RTC_BIND:-0.0.0.0}:8000:8000/tcp"
      - "${SRS_HTTP_BIND:-127.0.0.1}:8080:8080"
      - "127.0.0.1:1985:1985"
    volumes:
      - ./srs.runtime.conf:/usr/local/srs/conf/conglive.conf:ro
      - ./srs-html:/usr/local/srs/objs/nginx/html
      - ./recordings:/usr/local/srs/objs/nginx/html/recordings
    mem_limit: 384m
    networks: [conglive]

  mysql:
    image: mysql:8.4
    container_name: conglive-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先运行 server/install.sh}
      MYSQL_DATABASE: conglive
      MYSQL_USER: conglive
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先运行 server/install.sh}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: ["--max_connections=40"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 512m
    networks: [conglive]

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: conglive-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?请先运行 server/install.sh}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: conglive
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先运行 server/install.sh}
      MYSQL_DATABASE: conglive
      PUBLIC_HOST: ${PUBLIC_HOST:?请在 server/.env 中设置 PUBLIC_HOST}
      RTC_CANDIDATE: ${CANDIDATE:-}
      SRS_RTC_API: http://srs:1985
      SRS_HOOK_SECRET: ${SRS_HOOK_SECRET:?请先运行 server/install.sh}
      PUBLIC_API_SCHEME: ${PUBLIC_API_SCHEME:-http}
      PUBLIC_API_PORT: ${PUBLIC_API_PORT-3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      PLUGIN_ENABLED: ${PLUGIN_ENABLED:-welcome,stream-audit}
      DATA_DIR: /app/data
      RECORDINGS_DIR: /app/recordings
      COVERS_DIR: /app/covers
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请先运行 server/install.sh}
    ports:
      - "${API_BIND:-0.0.0.0}:3000:3000"
    volumes:
      - ./plugin-data:/app/data
      - ./recordings:/app/recordings
      - ./covers:/app/covers
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 256m
    networks: [conglive]

  web:
    build: ../web
    container_name: conglive-web
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-0.0.0.0}:8081:80"
      - "0.0.0.0:8443:8443"
    depends_on:
      backend:
        condition: service_healthy
      srs:
        condition: service_started
    volumes:
      - ./certs:/etc/nginx/certs:ro
    mem_limit: 128m
    networks: [conglive]

  caddy:
    image: caddy:2-alpine
    container_name: conglive-caddy
    restart: unless-stopped
    profiles: ["https"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_started
      srs:
        condition: service_started
    mem_limit: 96m
    networks: [conglive]

networks:
  conglive:

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
