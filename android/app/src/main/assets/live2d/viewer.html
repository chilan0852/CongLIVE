<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Live2D 看板娘</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 28% 16%, #1d2a52 0%, #0a0f1e 64%);
      font-family: sans-serif;
    }
    #stage { position: absolute; inset: 0; }
    canvas { display: block; }
    #tip {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 14px;
      padding: 0 18px;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
      color: #a6b1c7;
      text-shadow: 0 1px 2px #000;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- 只做界面看板娘，不会被合成进直播画面 / WebRTC 推流。 -->
  <div id="stage"></div>
  <div id="tip">输入 .model3.json 地址后点击「加载模型」</div>

  <!-- 运行库全部走 CDN，不内置模型或第三方大文件。 -->
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"
          onerror="window.__congliveCdnError = 'pixi.js 加载失败，请检查网络';"></script>
  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"
          onerror="window.__congliveCdnError = 'Live2D Cubism Core 加载失败，请检查网络';"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"
          onerror="window.__congliveCdnError = 'pixi-live2d-display 加载失败，请检查网络';"></script>

  <script>
    (function () {
      var app = null;
      var model = null;
      var tip = document.getElementById('tip');

      function report(message) {
        try { AndroidLive2D.onStatus(String(message)); } catch (error) { }
      }

      function reportError(message) {
        var text = String(message);
        tip.textContent = text;
        try { AndroidLive2D.onError(text); } catch (error) { }
      }

      function hasLive2D() {
        return !!(window.PIXI && window.PIXI.live2d && window.PIXI.live2d.Live2DModel);
      }

      function ensureApp() {
        if (app) return app;
        if (!window.PIXI || !window.PIXI.Application) throw new Error('pixi.js 未加载');
        var stage = document.getElementById('stage');
        app = new PIXI.Application({
          backgroundAlpha: 0,
          antialias: true,
          resolution: window.devicePixelRatio || 1,
          autoDensity: true,
          resizeTo: stage
        });
        stage.appendChild(app.view);
        return app;
      }

      function resizeModel() {
        if (!model || !app) return;
        var width = app.screen.width;
        var height = app.screen.height;
        var modelWidth = model.internalModel && model.internalModel.width ? model.internalModel.width : 0;
        var modelHeight = model.internalModel && model.internalModel.height ? model.internalModel.height : 0;
        if (!modelWidth || !modelHeight) return;
        var scale = Math.min((width * 0.94) / modelWidth, (height * 0.94) / modelHeight);
        model.scale.set(scale);
        model.anchor.set(0.5, 1);
        model.x = width / 2;
        model.y = height * 0.96;
      }

      function destroyModel() {
        if (!model) return;
        try {
          if (app) app.stage.removeChild(model);
          model.destroy();
        } catch (error) { }
        model = null;
      }

      window.loadLive2DModel = function (url) {
        if (!hasLive2D()) {
          reportError(window.__congliveCdnError || 'Live2D 运行库未加载，请检查网络后重试');
          return false;
        }
        tip.textContent = '正在加载模型…';
        var application;
        try {
          application = ensureApp();
        } catch (error) {
          reportError('画布初始化失败：' + (error && error.message ? error.message : error));
          return false;
        }
        destroyModel();
        PIXI.live2d.Live2DModel.from(String(url), { autoInteract: false }).then(function (loaded) {
          model = loaded;
          application.stage.addChild(model);
          resizeModel();
          tip.textContent = '';
          report('模型加载完成');
        }).catch(function (error) {
          var message = error && error.message ? error.message : String(error);
          reportError('模型加载失败：' + message);
        });
        return true;
      };

      window.showLive2D = function () {
        if (!model) { reportError('模型尚未加载'); return; }
        model.visible = true;
        report('模型已显示');
      };

      window.hideLive2D = function () {
        if (!model) { reportError('模型尚未加载'); return; }
        model.visible = false;
        report('模型已隐藏');
      };

      window.setLive2DPaused = function (paused) {
        if (!app) return;
        try {
          if (paused) app.ticker.stop();
          else app.ticker.start();
        } catch (error) { }
      };

      window.addEventListener('resize', resizeModel);
      report('Live2D 页面已就绪');
    })();
  </script>
</body>
</html>
