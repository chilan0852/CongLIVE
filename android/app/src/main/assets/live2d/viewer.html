<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Live2D 看板娘</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 28% 16%, #1d2a52 0%, #0a0f1e 64%);
      font-family: sans-serif;
    }
    #stage { position: absolute; inset: 0; }
    canvas { display: block; }
    #tip {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 14px;
      padding: 0 18px;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
      color: #a6b1c7;
      text-shadow: 0 1px 2px #000;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- 只做界面看板娘，不会被合成进直播画面 / WebRTC 推流。 -->
  <div id="stage"></div>
  <div id="tip">输入 .model3.json 地址后点击「加载模型」</div>

  <!-- 运行库全部走 CDN，不内置模型或第三方大文件。 -->
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"
          onerror="window.__congliveCdnError = 'pixi.js';"></script>
  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"
          onerror="window.__congliveCdnError = 'Live2D Cubism Core';"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"
          onerror="window.__congliveCdnError = 'pixi-live2d-display';"></script>

  <script>
    (function () {
      var app = null;
      var model = null;
      var tip = document.getElementById('tip');

      // v0.7.7: zh/en strings for the Live2D page itself. Android calls
      // window.setLive2DLanguage("zh"|"en") when the in-app language changes.
      var STRINGS = {
        zh: {
          title: 'Live2D 看板娘',
          tip: '输入 .model3.json 地址后点击「加载模型」',
          ready: 'Live2D 页面已就绪',
          loading: '正在加载模型…',
          loaded: '模型加载完成',
          loadFailed: '模型加载失败：',
          canvasFailed: '画布初始化失败：',
          notLoaded: '模型尚未加载',
          shown: '模型已显示',
          hidden: '模型已隐藏',
          cdnFailed: '%s 加载失败，请检查网络',
          runtimeMissing: 'Live2D 运行库未加载，请检查网络后重试',
          pixiMissing: 'pixi.js 未加载'
        },
        en: {
          title: 'Live2D Mascot',
          tip: 'Paste a .model3.json URL, then tap “Load model”',
          ready: 'Live2D page ready',
          loading: 'Loading model…',
          loaded: 'Model loaded',
          loadFailed: 'Failed to load model: ',
          canvasFailed: 'Canvas initialization failed: ',
          notLoaded: 'No model loaded yet',
          shown: 'Model shown',
          hidden: 'Model hidden',
          cdnFailed: 'Failed to load %s; check your network',
          runtimeMissing: 'The Live2D runtime failed to load; check your network and retry',
          pixiMissing: 'pixi.js is not loaded'
        }
      };
      var strings = STRINGS.zh;

      function msg(key) {
        return strings[key] || STRINGS.zh[key] || key;
      }

      window.setLive2DLanguage = function (code) {
        strings = code === 'en' ? STRINGS.en : STRINGS.zh;
        document.documentElement.lang = code === 'en' ? 'en' : 'zh-CN';
        document.title = msg('title');
        if (!model) {
          tip.textContent = msg('tip');
          report(msg('ready'));
        }
      };

      function report(message) {
        try { AndroidLive2D.onStatus(String(message)); } catch (error) { }
      }

      function reportError(message) {
        var text = String(message);
        tip.textContent = text;
        try { AndroidLive2D.onError(text); } catch (error) { }
      }

      function hasLive2D() {
        return !!(window.PIXI && window.PIXI.live2d && window.PIXI.live2d.Live2DModel);
      }

      function ensureApp() {
        if (app) return app;
        if (!window.PIXI || !window.PIXI.Application) throw new Error(msg('pixiMissing'));
        var stage = document.getElementById('stage');
        app = new PIXI.Application({
          backgroundAlpha: 0,
          antialias: true,
          resolution: window.devicePixelRatio || 1,
          autoDensity: true,
          resizeTo: stage
        });
        stage.appendChild(app.view);
        return app;
      }

      function resizeModel() {
        if (!model || !app) return;
        var width = app.screen.width;
        var height = app.screen.height;
        var modelWidth = model.internalModel && model.internalModel.width ? model.internalModel.width : 0;
        var modelHeight = model.internalModel && model.internalModel.height ? model.internalModel.height : 0;
        if (!modelWidth || !modelHeight) return;
        var scale = Math.min((width * 0.94) / modelWidth, (height * 0.94) / modelHeight);
        model.scale.set(scale);
        model.anchor.set(0.5, 1);
        model.x = width / 2;
        model.y = height * 0.96;
      }

      function destroyModel() {
        if (!model) return;
        try {
          if (app) app.stage.removeChild(model);
          model.destroy();
        } catch (error) { }
        model = null;
      }

      window.loadLive2DModel = function (url) {
        if (!hasLive2D()) {
          reportError(window.__congliveCdnError ? msg('cdnFailed').replace('%s', window.__congliveCdnError) : msg('runtimeMissing'));
          return false;
        }
        tip.textContent = msg('loading');
        var application;
        try {
          application = ensureApp();
        } catch (error) {
          reportError(msg('canvasFailed') + (error && error.message ? error.message : error));
          return false;
        }
        destroyModel();
        PIXI.live2d.Live2DModel.from(String(url), { autoInteract: false }).then(function (loaded) {
          model = loaded;
          application.stage.addChild(model);
          resizeModel();
          tip.textContent = '';
          report(msg('loaded'));
        }).catch(function (error) {
          var message = error && error.message ? error.message : String(error);
          reportError(msg('loadFailed') + message);
        });
        return true;
      };

      window.showLive2D = function () {
        if (!model) { reportError(msg('notLoaded')); return; }
        model.visible = true;
        report(msg('shown'));
      };

      window.hideLive2D = function () {
        if (!model) { reportError(msg('notLoaded')); return; }
        model.visible = false;
        report(msg('hidden'));
      };

      window.setLive2DPaused = function (paused) {
        if (!app) return;
        try {
          if (paused) app.ticker.stop();
          else app.ticker.start();
        } catch (error) { }
      };

      window.addEventListener('resize', resizeModel);
      report(msg('ready'));
    })();
  </script>
</body>
</html>
